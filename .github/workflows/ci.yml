# Lint + tests on every push and PR. Mirrors what pre-commit and
# docker-compose.test.yml do locally, so a Dependabot PR cannot land unverified.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. This is a public repo, so `pull_request` runs a fork's code — the
# job needs to read the tree and nothing else.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Same image and credentials as docker-compose.test.yml; only the port differs
      # (a service container has the host port to itself).
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ta_test
          POSTGRES_USER: ta_test
          POSTGRES_PASSWORD: ta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ta_test -d ta_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    env:
      TA_TEST_DATABASE_URL: postgresql+psycopg://ta_test:ta_test@localhost:5432/ta_test

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      # No --extra client: OpenCV is a heavy wheel and nothing under test imports it.
      - run: uv sync --extra dev --extra server

      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

      - run: uv run pytest

      # Fail if the models drifted from the migrations (the pre-commit hook, in CI).
      - run: scripts/alembic_check.sh
