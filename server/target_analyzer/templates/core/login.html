{% extends "base.html" %}
{% block title %}Log in — target-analyzer{% endblock %}
{% block content %}
  <div class="panel panel-narrow">
    <h1>Log in</h1>
    {% if error %}<p class="flash error" id="form-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input id="username"
             name="username"
             autocomplete="username"
             autofocus
             {% if error %}aria-describedby="form-error"{% endif %}
             required>
      <label for="password">Password</label>
      <input id="password"
             name="password"
             type="password"
             autocomplete="current-password"
             required>
      <p>
        <button type="submit">Log in</button>
      </p>
    </form>
  </div>
{% endblock %}
