[project]
name = "target-analyzer"
version = "0.1.0"
description = "Self-hosted scoring of photos of paper shooting targets (Mac client + Raspberry Pi server)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
# Base deps = the wire contract + config, needed by both sides. The heavy,
# side-specific deps live in the extras below (client = OpenCV, server = FastAPI).
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
# Raspberry Pi server: FastAPI + Postgres/SQLModel + HTMX dashboard + image handling.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.50.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "bcrypt>=4.2",
    "itsdangerous>=2.2",
    "pillow>=11.0",
]
# Mac processing client: OpenCV does homography + the click UI + decode/EXIF strip
# (opencv-contrib bundles cv2.aruco for the marker board); httpx ships to the Pi.
client = [
    "opencv-contrib-python>=4.10",
    "httpx>=0.28",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pre-commit>=4.0",
    # fastapi.testclient's transport. Listed here rather than taken from the client
    # extra, so the suite never depends on OpenCV being installed to run.
    # ponytail: starlette deprecates httpx for TestClient in favour of httpx2
    # (github.com/pydantic/httpx2) — a one-line swap here plus the client extra in P4,
    # when ship.py picks its client and both sides can move together.
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Three packages, one wheel: shared contract, client, server. Extras gate the
# dependencies, not which packages ship.
packages = ["shared/ta_shared", "client/ta_client", "server/target_analyzer"]

[tool.pytest.ini_options]
pythonpath = ["shared", "client", "server", "."]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.bandit.assert_used]
# Asserts in these modules are deliberate self-checks (`python -m <module>`), run to
# prove an invariant on a box without pytest — never a security control.
skips = ["*/scoring.py", "*/selfcheck.py"]

[tool.ruff]
line-length = 100
src = ["shared", "client", "server", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by Alembic; long lines are unavoidable and not worth reflowing.
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses callables in argument defaults by design (Depends/Form/File/Query).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Query",
]
