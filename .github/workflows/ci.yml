# Lint + tests on every push and PR. Mirrors what pre-commit and
# docker-compose.test.yml do locally, so a Dependabot PR cannot land unverified.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. This is a public repo, so `pull_request` runs a fork's code — the
# job needs to read the tree and nothing else.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Same image and credentials as docker-compose.test.yml; only the port differs
      # (a service container has the host port to itself).
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ta_test
          POSTGRES_USER: ta_test
          POSTGRES_PASSWORD: ta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ta_test -d ta_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    env:
      TA_TEST_DATABASE_URL: postgresql+psycopg://ta_test:ta_test@localhost:5432/ta_test

    steps:
      - uses: actions/checkout@v7

      # An exact release, not a major tag: setup-uv stopped publishing moving major tags
      # after v7, so `@v8` and up resolve to nothing and fail the run before it starts.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # No --extra client here: OpenCV is a heavy wheel, and the client is verified by
      # its own self-check in the `client` job below.
      - run: uv sync --extra dev --extra server

      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run djlint server/target_analyzer/templates --check

      # static/app.css is generated and committed so the image build needs no Node.
      # Nothing else notices when a template gains a class the built sheet lacks:
      # every other check passes and the page just renders wrong.
      - run: make css
      - run: git diff --exit-code -- server/target_analyzer/static/app.css

      - run: uv run pytest

      # Fail if the models drifted from the migrations (the pre-commit hook, in CI).
      - run: scripts/alembic_check.sh

  # The client half: OpenCV only, no database, no pytest. Its self-check is headless by
  # design, so it runs here exactly as it runs on the Mac — which is what catches an
  # ArUco API rename in a Dependabot bump before it reaches a range trip.
  client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # An exact release, not a major tag: setup-uv stopped publishing moving major tags
      # after v7, so `@v8` and up resolve to nothing and fail the run before it starts.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - run: uv sync --extra client

      - run: uv run python -m ta_client.selfcheck
