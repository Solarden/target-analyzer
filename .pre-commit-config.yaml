# Run `uv run pre-commit install` once to enable. See README.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-case-conflict
      - id: debug-statements
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: detect-private-key

  # Run from the lock rather than pinned here, so the hook and CI run one version: two
  # formatters undo each other forever.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --extra dev ruff check --force-exclude --fix --show-fixes --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --extra dev ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      # The profile comes from pyproject.toml.
      - id: djlint-reformat
        name: djLint formatting
        entry: uv run --extra dev djlint --reformat
        language: system
        types_or: [html]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.18
    hooks:
      - id: uv-lock

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      # Runs hadolint in a container, so no local binary is needed.
      - id: hadolint-docker

  - repo: local
    hooks:
      # Fail if models drifted from migrations (autogenerate would be non-empty).
      - id: alembic-check
        name: alembic check (model/migration drift)
        entry: scripts/alembic_check.sh
        language: script
        pass_filenames: false
        files: ^(server/target_analyzer/models\.py$|alembic/)
