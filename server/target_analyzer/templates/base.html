<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}target-analyzer{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  </head>
  <body>
    {% if user %}
      <header>
        <h1>
          <a href="/dashboard">target-analyzer</a>
        </h1>
        <nav>
          <a href="/dashboard">Trend</a>
        </nav>
        <form class="userbox" method="post" action="/logout">
          <button type="submit" class="ghost">Log out</button>
        </form>
      </header>
    {% endif %}
    <main>
      {% if error %}<p class="flash flash-error">{{ error }}</p>{% endif %}
      {% block content %}{% endblock %}
    </main>
    <footer>
      <a href="{{ source_url }}" rel="noopener">Source</a> — AGPL-3.0-or-later
    </footer>
  </body>
</html>
